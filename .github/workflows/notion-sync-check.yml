name: Notion Sync Check

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/notion-sync-full.ts"
      - "package.json"
      - ".github/workflows/notion-sync-check.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/notion-sync-full.ts"
      - "package.json"
      - ".github/workflows/notion-sync-check.yml"

concurrency:
  group: notion-sync-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notion-sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Validate payload page IDs
        run: bun run notion:sync:validate

      - name: Require NOTION_TOKEN secret
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::error::Missing NOTION_TOKEN secret for notion:sync:full:dry"
            exit 1
          fi

      - name: Run Notion full sync dry-run
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: bun run notion:sync:full:dry
