name: Notion Sync Check

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/notion-sync-full.ts"
      - "package.json"
      - ".github/workflows/notion-sync-check.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/notion-sync-full.ts"
      - "package.json"
      - ".github/workflows/notion-sync-check.yml"

concurrency:
  group: notion-sync-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notion-sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.9

      - name: Validate payload page IDs
        run: bun run notion:sync:validate

      - name: Require NOTION_TOKEN secret
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::error::Missing NOTION_TOKEN secret for notion:sync:full:dry"
            exit 1
          fi

      - name: Run Notion full sync dry-run
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: bun run notion:sync:full:dry
