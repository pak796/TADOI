name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      # Keep stable releases strict while allowing prerelease tag validation runs.
      TADOI_REQUIRE_SIGNING: ${{ contains(github.ref_name, '-') && '0' || '1' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Verify macOS packaging prerequisites
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          for tool in pkgbuild productbuild hdiutil; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "missing required macOS packaging tool: $tool" >&2
              echo "install Xcode command line tools and retry." >&2
              exit 1
            fi
          done

      - name: Install Inno Setup (Windows)
        if: matrix.target == 'windows'
        run: choco install innosetup --no-progress -y

      - name: Verify Inno Setup compiler (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            throw "Inno Setup compiler (iscc) was not found after installation."
          }
          Write-Host "iscc path: $($iscc.Source)"

      - name: Install Linux packaging prerequisites
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

          if ! command -v dpkg-deb >/dev/null 2>&1; then
            echo "dpkg-deb not found after installing dpkg-dev." >&2
            exit 1
          fi

          appimagetool_version="1.9.1"
          appimage_path="$RUNNER_TEMP/appimagetool-${appimagetool_version}.AppImage"
          wrapper_path="$RUNNER_TEMP/appimagetool"
          curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/${appimagetool_version}/appimagetool-x86_64.AppImage" -o "$appimage_path"
          chmod +x "$appimage_path"
          {
            echo "#!/usr/bin/env bash"
            echo "set -euo pipefail"
            echo "APPIMAGE_EXTRACT_AND_RUN=1 \"$appimage_path\" \"\$@\""
          } > "$wrapper_path"
          chmod +x "$wrapper_path"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP:$PATH"

          if ! command -v appimagetool >/dev/null 2>&1; then
            echo "appimagetool wrapper install failed." >&2
            exit 1
          fi

      - name: Build raw binary
        run: bun scripts/build-binary.ts --target ${{ matrix.target }} --format raw --mode build

      - name: Binary smoke test
        run: bun run installer:smoke --target ${{ matrix.target }} --scope binary

      - name: Build installer
        run: bun scripts/build-binary.ts --target ${{ matrix.target }} --format installer --mode build

      - name: Installer artifact manifest gate
        run: bun run installer:gate --target ${{ matrix.target }}

      - name: Installer smoke test
        run: bun run installer:smoke --target ${{ matrix.target }} --scope installer

      - name: SHA256SUMS (Unix)
        if: matrix.target != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          output="dist/SHA256SUMS-${{ matrix.target }}.txt"
          : > "$output"
          if [ -d "dist/bin/${{ matrix.target }}" ]; then
            while IFS= read -r -d '' file; do
              shasum -a 256 "$file" >> "$output"
            done < <(find "dist/bin/${{ matrix.target }}" -type f -print0)
          fi
          if [ -d "dist/installers" ]; then
            while IFS= read -r -d '' file; do
              shasum -a 256 "$file" >> "$output"
            done < <(find "dist/installers" -type f -print0)
          fi

      - name: SHA256SUMS (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $output = "dist/SHA256SUMS-${{ matrix.target }}.txt"
          New-Item -ItemType File -Force $output | Out-Null
          if (Test-Path "dist/bin/${{ matrix.target }}") {
            Get-ChildItem -Path "dist/bin/${{ matrix.target }}" -File -Recurse |
              Get-FileHash -Algorithm SHA256 |
              ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), $_.Path } |
              Add-Content $output
          }
          if (Test-Path "dist/installers") {
            Get-ChildItem -Path "dist/installers" -File -Recurse |
              Get-FileHash -Algorithm SHA256 |
              ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), $_.Path } |
              Add-Content $output
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tadoi-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/bin/${{ matrix.target }}/**
            dist/installers/**
            dist/SHA256SUMS-${{ matrix.target }}.txt

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts

      - name: Verify release manifests
        shell: bash
        run: |
          set -euo pipefail
          for target in macos windows linux; do
            if ! find "release-artifacts" -type f -name "TADOI-${target}-*-manifest.json" | grep -q .; then
              echo "missing release manifest for target: ${target}" >&2
              exit 1
            fi
          done

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-upload
          mkdir -p release-upload

          copy_by_name_preserve() {
            local pattern="$1"
            local source
            source="$(find release-artifacts -type f -name "$pattern" | sort | head -n1 || true)"
            if [ -z "$source" ]; then
              echo "missing release asset for pattern: $pattern" >&2
              exit 1
            fi
            cp "$source" "release-upload/$(basename "$source")"
          }

          copy_by_path() {
            local pattern="$1"
            local destination="$2"
            local source
            source="$(find release-artifacts -type f -path "$pattern" | sort | head -n1 || true)"
            if [ -z "$source" ]; then
              echo "missing release asset for path pattern: $pattern" >&2
              exit 1
            fi
            cp "$source" "$destination"
          }

          copy_by_name_preserve "SHA256SUMS-linux.txt"
          copy_by_name_preserve "SHA256SUMS-macos.txt"
          copy_by_name_preserve "SHA256SUMS-windows.txt"

          copy_by_name_preserve "TADOI-linux-*-manifest.json"
          copy_by_name_preserve "TADOI-macos-*-manifest.json"
          copy_by_name_preserve "TADOI-windows-*-manifest.json"

          copy_by_name_preserve "TADOI-macOS-*.dmg"
          copy_by_name_preserve "TADOI-*.pkg"
          copy_by_name_preserve "TADOI-Setup-x64-*.exe"
          copy_by_name_preserve "tadoi_*.deb"
          copy_by_name_preserve "tadoi-*-x86_64.AppImage"

          copy_by_path "*/dist/bin/linux/tadoi" "release-upload/tadoi-linux"
          copy_by_path "*/dist/bin/macos/tadoi" "release-upload/tadoi-macos"
          copy_by_path "*/dist/bin/windows/tadoi.exe" "release-upload/tadoi.exe"

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            release-upload/*
