name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      TADOI_REQUIRE_SIGNING: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            binary: dist/bin/macos/tadoi
          - os: windows-latest
            target: windows
            binary: dist/bin/windows/tadoi.exe
          - os: ubuntu-latest
            target: linux
            binary: dist/bin/linux/tadoi

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Install Inno Setup (Windows)
        if: matrix.target == 'windows'
        run: choco install innosetup --no-progress -y

      - name: Build raw binary
        run: bun scripts/build-binary.ts --target ${{ matrix.target }} --format raw --mode build

      - name: Build installer
        run: bun scripts/build-binary.ts --target ${{ matrix.target }} --format installer --mode build

      - name: Smoke test (Unix)
        if: matrix.target != 'windows'
        shell: bash
        run: |
          "${{ matrix.binary }}" --version
          "${{ matrix.binary }}" export --help
          "${{ matrix.binary }}" --smoke-tui

      - name: Smoke test (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          & "${{ matrix.binary }}" --version
          & "${{ matrix.binary }}" export --help
          & "${{ matrix.binary }}" --smoke-tui

      - name: SHA256SUMS (Unix)
        if: matrix.target != 'windows'
        shell: bash
        run: |
          mkdir -p dist
          OUTPUT="dist/SHA256SUMS-${{ matrix.target }}.txt"
          : > "$OUTPUT"
          if [ -d "dist/bin/${{ matrix.target }}" ]; then
            while IFS= read -r -d '' file; do
              shasum -a 256 "$file" >> "$OUTPUT"
            done < <(find "dist/bin/${{ matrix.target }}" -type f -print0)
          fi
          if [ -d "dist/installers" ]; then
            while IFS= read -r -d '' file; do
              shasum -a 256 "$file" >> "$OUTPUT"
            done < <(find dist/installers -type f -print0)
          fi

      - name: SHA256SUMS (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $output = "dist/SHA256SUMS-${{ matrix.target }}.txt"
          New-Item -ItemType File -Force $output | Out-Null
          if (Test-Path "dist/bin/${{ matrix.target }}") {
            Get-ChildItem -Path "dist/bin/${{ matrix.target }}" -File -Recurse |
              Get-FileHash -Algorithm SHA256 |
              ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), $_.Path } |
              Add-Content $output
          }
          if (Test-Path "dist/installers") {
            Get-ChildItem -Path "dist/installers" -File -Recurse |
              Get-FileHash -Algorithm SHA256 |
              ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), $_.Path } |
              Add-Content $output
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tadoi-${{ matrix.target }}
          path: |
            dist/bin/${{ matrix.target }}/**
            dist/installers/**
            dist/SHA256SUMS-${{ matrix.target }}.txt

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          files: |
            release-artifacts/**/*
