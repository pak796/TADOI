name: Package macOS Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Host preflight (release)
        run: bun run preflight:host:release

      - name: Verify macOS packaging prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for tool in pkgbuild productbuild hdiutil; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "missing required macOS packaging tool: $tool" >&2
              echo "install Xcode command line tools and retry." >&2
              exit 1
            fi
          done

      - name: Test
        env:
          TADOI_TEST_SHARDS: "6"
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Build raw binary
        run: bun scripts/build-binary.ts --target macos --format raw --mode build

      - name: Build macOS installer
        run: bun scripts/build-binary.ts --target macos --format installer --mode build

      - name: Installer artifact manifest gate
        run: bun run installer:gate --target macos

      - name: Installer smoke test
        run: bun run installer:smoke --target macos --scope all

      - name: SHA256SUMS
        shell: bash
        run: |
          mkdir -p dist
          OUTPUT="dist/SHA256SUMS-macos.txt"
          : > "$OUTPUT"
          if [ -d "dist/bin/macos" ]; then
            while IFS= read -r -d '' file; do
              shasum -a 256 "$file" >> "$OUTPUT"
            done < <(find "dist/bin/macos" -type f -print0)
          fi
          if [ -d "dist/installers" ]; then
            while IFS= read -r -d '' file; do
              shasum -a 256 "$file" >> "$OUTPUT"
            done < <(find "dist/installers" -type f -print0)
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tadoi-macos-${{ github.sha }}
          retention-days: 2
          path: |
            dist/bin/macos/**
            dist/installers/**
            dist/SHA256SUMS-macos.txt
