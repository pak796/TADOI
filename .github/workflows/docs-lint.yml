name: Docs Lint

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "TADOI_*.md"
      - "scripts/docs-lint.ts"
      - "scripts/keybind-sync-audit.py"
      - "scripts/doc-drift-scan.py"
      - "scripts/doc-drift-scan.test.ts"
      - "scripts/generate-keybind-doc.ts"
      - "skills/host-prereq-preflight/**"
      - "package.json"
      - ".github/workflows/docs-lint.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
      - "TADOI_*.md"
      - "scripts/docs-lint.ts"
      - "scripts/keybind-sync-audit.py"
      - "scripts/doc-drift-scan.py"
      - "scripts/doc-drift-scan.test.ts"
      - "scripts/generate-keybind-doc.ts"
      - "skills/host-prereq-preflight/**"
      - "package.json"
      - ".github/workflows/docs-lint.yml"

concurrency:
  group: docs-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint markdown links and anchors
        run: bun run docs:lint

      - name: Verify canonical keybinding docs are current
        run: bun run keybind:canonical:check

  doc-drift-help-settings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Help/Settings doc drift audit command
        run: bun run doc:drift:help-settings
