name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.9

      - name: Bun version
        run: bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Typecheck
        run: bun run typecheck

      - name: Branding guard
        run: bun run brand:check

      - name: DTF contract drift check
        run: bun run contract:dtf:check

      - name: Install Inno Setup (Windows)
        if: matrix.target == 'windows'
        run: choco install innosetup --no-progress -y

      - name: Build raw binary
        run: bun scripts/build-binary.ts --target ${{ matrix.target }} --format raw --mode build

      - name: Build installer artifacts
        run: bun scripts/build-binary.ts --target ${{ matrix.target }} --format installer --mode build

      - name: Installer smoke test
        run: bun run installer:smoke --target ${{ matrix.target }}

      - name: Build tarball artifact
        if: matrix.target == 'linux'
        run: bun run pack:dry

      - name: Inspect tarball contents
        if: matrix.target == 'linux'
        run: bun run pack:inspect

      - name: Tarball install smoke test
        if: matrix.target == 'linux'
        run: bun run pack:smoke
