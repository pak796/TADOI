name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Bun version
        run: bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Typecheck
        run: bun run typecheck

      - name: Branding guard
        run: bun run brand:check

      - name: Build tarball artifact
        if: matrix.os == 'ubuntu-latest'
        run: bun run pack:dry

      - name: Inspect tarball contents
        if: matrix.os == 'ubuntu-latest'
        run: bun run pack:inspect

      - name: Tarball install smoke test
        if: matrix.os == 'ubuntu-latest'
        run: bun run pack:smoke
