name: Daily Build

on:
  schedule:
    - cron: "0 14 * * *" # 08:00 America/Chicago (UTC; DST shift applies)
  workflow_dispatch:

jobs:
  daily-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.9

      - name: Bun version
        run: bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Inno Setup (Windows)
        if: matrix.target == 'windows'
        run: choco install innosetup --no-progress -y

      - name: Build daily artifacts
        run: bun run build:daily

      - name: Assert Windows installer output
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $matches = @(Get-ChildItem -Path "dist/artifacts" -Recurse -File -Filter "TADOI-Setup-x64-*.exe" -ErrorAction SilentlyContinue)
          if ($matches.Count -lt 1) {
            Write-Error "Expected Windows installer (TADOI-Setup-x64-*.exe) under dist/artifacts, but none was found."
            exit 1
          }

          Write-Host "Found Windows installer artifact(s):"
          $matches | ForEach-Object { Write-Host " - $($_.FullName)" }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tadoi-daily-${{ matrix.target }}-${{ github.sha }}
          path: dist/artifacts/**
