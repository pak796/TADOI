context_note: "Repo-derived working context. Update this file when repo behavior changes."
doc_id: ai_system
last_reviewed_on: "2026-04-12"
system_name: "TADOI terminal productivity application"

purpose:
  - "Provide repo-local Codex workflow instructions and durable memory."
  - "Ship a terminal-first task manager with a shared in-app and CLI command layer."
  - "Support local markdown notes, backup and restore flows, reminders, and packaging workflows."
  - "Store portable repo-local snapshots of grounded cross-repo skills."

major_parts:
  - path: "AGENTS.md"
    role: "Repo-local defaults"
    behavior: "Adds repo-scoped workflow rules and skill routing on top of the base Codex instruction stack."
  - path: "docs/CODEX_WORKFLOW.md"
    role: "Detailed runbook"
    behavior: "Expands the workflow model, prompt contract, branching rules, validation defaults, and memory placement rules."
  - path: "docs/ai"
    role: "Durable project memory"
    behavior: "Holds maintained metadata, system map, structure map, compact memory, and the high-signal update tracker."
  - path: "docs/codex"
    role: "Task and session workflow layer"
    behavior: "Holds templates and the canonical task artifact root."
  - path: "skills"
    role: "Repo-owned live skills"
    behavior: "Stores TADOI-maintained skills, scripts, and agent definitions used directly in this repo."
  - path: "ai/skills"
    role: "Vendored skill snapshots"
    behavior: "Stores portable copies of grounded cross-repo skills for repo-local reference, portability, and deterministic install workflows."
  - path: "src"
    role: "Application runtime"
    behavior: "Owns the terminal UI, command routing, domain logic, notes flows, backup flows, reminders, and persistence behavior."
  - path: "scripts"
    role: "Repo tooling"
    behavior: "Provides test orchestration, drift checks, docs linting, packaging helpers, and workflow scripts."
  - path: "packaging"
    role: "Distribution assets"
    behavior: "Holds installer and packaging helpers for shipped binaries and release artifacts."

runtime_behavior:
  - "The runtime is terminal-first and uses Bun, OpenTUI, and React."
  - "TITS is the shared command layer used by both the in-app command bar and the external CLI."
  - "TOME is the local markdown notes surface with seeded guide notes, restore-defaults, reindex, and copy-first notes-root migration behavior."
  - "Tasks persist to an OS-specific JSON data file, and the current persisted schema baseline is version 8."
  - "CLI write commands are lock-gated while the TUI is running."
  - "Backup Center covers local backup/export/import flows and a GitHub CLI backup path."
  - "Reminder and notification flows exist in-app, with helper install and uninstall commands."
  - "Release and packaging workflows are host-sensitive and depend on explicit preflight checks."
  - "The repo now distinguishes repo-owned live skills under `skills/**` from vendored skill snapshots under `ai/skills/**`."

operational_boundaries:
  - surface: "durable_memory"
    boundary: "docs/ai stores stable repo facts and should remain compact."
  - surface: "task_session_memory"
    boundary: "docs/codex/tasks stores task-scoped plans, trackers, summaries, and handoffs."
  - surface: "repo_owned_live_skills"
    boundary: "skills stores TADOI-maintained live skills that can include scripts and agent definitions."
  - surface: "vendored_skills"
    boundary: "ai/skills stores repo-local skill copies and provenance, not live runtime installation state."
  - surface: "runtime_source"
    boundary: "src owns shipped CLI and TUI behavior plus persistence, notes, reminders, and backup flows."
  - surface: "workflow_docs"
    boundary: "AGENTS.md, docs/CODEX_WORKFLOW.md, and docs/codex define how the repo should be worked in."
  - surface: "release_packaging"
    boundary: "packaging and release scripts define binary, tarball, and installer workflows."

key_dependencies:
  - "Bun"
  - "TypeScript"
  - "OpenTUI"
  - "React"
  - "Git"
  - "Node.js"
